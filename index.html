<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔮 Mystic Number Guessing Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            overflow: hidden;
            position: relative;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 80%, rgba(120,119,198,0.3) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(255,119,198,0.3) 0%, transparent 50%),
                        radial-gradient(circle at 40% 40%, rgba(120,219,255,0.3) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
        }
        .container {
            background: rgba(15, 15, 25, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            padding: 45px 35px;
            width: 450px;
            text-align: center;
            position: relative;
            z-index: 2;
            transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .container:hover {
            transform: translateY(-12px) scale(1.02);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-family: 'Orbitron', monospace;
            color: #fff;
            margin-bottom: 10px;
            font-weight: 900;
            font-size: 32px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            letter-spacing: 2px;
        }
        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 35px;
            font-size: 16px;
            font-weight: 300;
        }
        .input-group {
            margin-bottom: 25px;
            position: relative;
        }
        input[type="number"] {
            width: 100%;
            padding: 18px 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 20px;
            font-weight: 600;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        input[type="number"]::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        input[type="number"]:focus {
            border-color: #00ff88;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.4);
        }
        .buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }
        button {
            flex: 1;
            padding: 16px 20px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Orbitron', monospace;
            letter-spacing: 1px;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }
        #submitBtn {
            background: linear-gradient(45deg, #00ff88, #00cc6a);
            color: #000;
            box-shadow: 0 8px 25px rgba(0, 255, 136, 0.4);
        }
        #submitBtn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(0, 255, 136, 0.6);
        }
        #newGameBtn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a52);
            color: white;
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4);
        }
        #newGameBtn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(255, 107, 107, 0.6);
        }
        #message {
            margin-top: 25px;
            font-size: 22px;
            font-weight: 700;
            min-height: 80px;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            transition: all 0.5s ease;
        }
        #attempts, #highScore {
            margin-top: 12px;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 400;
        }
        .emoji {
            font-size: 48px;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 10px currentColor);
        }
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1000;
        }
        @media (max-width: 480px) {
            .container {
                width: 90%;
                padding: 35px 25px;
            }
            h1 { font-size: 26px; }
            .buttons { flex-direction: column; }
        }
    </style>
</head>
<body>
    <canvas id="confetti-canvas"></canvas>
    <div class="container">
        <h1>🔮 Mystic Guess</h1>
        <p class="subtitle">Can you unveil the secret number between 1 and 100?</p>

        <div class="input-group">
            <input type="number" id="guess" min="1" max="100" placeholder="🔍 Enter your guess...">
        </div>

        <div class="buttons">
            <button id="submitBtn" onclick="checkGuess()">Submit Guess</button>
            <button id="newGameBtn" onclick="newGame()">New Game</button>
        </div>

        <div id="message">
            <!-- Mystic feedback appears here -->
        </div>
        <div id="attempts"></div>
        <div id="highScore"></div>
    </div>

    <script>
        let randomNumber;
        let attempts = 0;
        let highScore = localStorage.getItem('guessHighScore') || Infinity;
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        function updateHighScoreDisplay() {
            document.getElementById('highScore').innerHTML = `🏆 Best: ${highScore} attempts`;
        }

        function startNewGame() {
            randomNumber = Math.floor(Math.random() * 100) + 1;
            attempts = 0;
            document.getElementById('message').innerHTML = '<span class="emoji">✨</span><br>Ready to divine the number?';
            document.getElementById('message').style.color = '#fff';
            document.getElementById('attempts').textContent = '';
            document.getElementById('guess').value = '';
            document.getElementById('guess').focus();
            updateHighScoreDisplay();
        }

        function checkGuess() {
            const guess = parseInt(document.getElementById('guess').value);
            const messageDiv = document.getElementById('message');

            if (isNaN(guess) || guess < 1 || guess > 100) {
                messageDiv.innerHTML = '<span class="emoji">⚠️</span><br>Enter a number from 1 to 100, seeker!';
                messageDiv.style.color = '#ffaa00';
                return;
            }

            attempts++;
            document.getElementById('attempts').textContent = `Attempts: ${attempts}`;

            if (guess === randomNumber) {
                messageDiv.innerHTML = `<span class="emoji">🎊</span><br>Magnificent! The number was <strong>${randomNumber}</strong>`;
                messageDiv.style.color = '#00ff88';
                if (attempts < highScore) {
                    highScore = attempts;
                    localStorage.setItem('guessHighScore', highScore);
                    messageDiv.innerHTML += '<br>🌟 New high score!';
                }
                launchConfetti();
                playWinSound();
            } else if (guess < randomNumber) {
                messageDiv.innerHTML = '<span class="emoji">⬆️</span><br>The number is higher... ascend!';
                messageDiv.style.color = '#74b9ff';
            } else {
                messageDiv.innerHTML = '<span class="emoji">⬇️</span><br>The number is lower... descend!';
                messageDiv.style.color = '#e17055';
            }
            document.getElementById('guess').value = '';
            document.getElementById('guess').focus();
            updateHighScoreDisplay();
        }

        function launchConfetti() {
            const confetti = [];
            for (let i = 0; i < 100; i++) {
                confetti.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    r: Math.random() * 6 + 2,
                    d: Math.random() * 100 + 10,
                    color: `hsl(${Math.random() * 360}, 100%, 60%)`,
                    rotation: Math.random() * 360,
                    dr: Math.random() * 50 + 10
                });
            }
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                confetti.forEach((c, i) => {
                    c.y += c.d / 2;
                    c.rotation += c.dr;
                    ctx.save();
                    ctx.translate(c.x, c.y);
                    ctx.rotate(c.rotation * Math.PI / 180);
                    ctx.fillStyle = c.color;
                    ctx.fillRect(-c.r, -c.r, c.r * 2, c.r * 2);
                    ctx.restore();
                    if (c.y > canvas.height) confetti.splice(i, 1);
                });
                if (confetti.length) requestAnimationFrame(animate);
            }
            animate();
        }

        function playWinSound() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.5);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.5);
        }

        function newGame() {
            startNewGame();
        }

        // Event listeners
        document.getElementById('guess').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkGuess();
        });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Initialize
        startNewGame();
    </script>
</body>
</html>
